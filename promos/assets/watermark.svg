<svg xmlns="http://www.w3.org/2000/svg" viewBox="31 24 40 64">
  <!-- Slide watermark: the glyph from src/icon-mask.svg, in white, with no tile — and without the
       sheet of paper. At watermark scale the sheet is a 1000px flat slab whose edges and punched-out
       rules read as hard grey boxes across every slide, so only what is printed on the invoice is
       kept: the three text lines, the total, and its double rule, as solid pills. The viewBox is
       cropped to them, so they run off the slide edge the way the parcel does on Shipper's. -->
